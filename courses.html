<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UniMate - My Courses</title>

    <link rel="stylesheet" href="stylecss.css">
</head>

<body>

<header>
    <h2 class="logo">UniMate</h2>

    <nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="courses.html">My Courses</a>
    <a href="summaries.html">Summaries</a>
    <a href="schedule.html">Study Schedule</a>
    <a href="quizzes.html">Quizzes</a>
    <a href="progresos.html">My Progress</a>
    <a href="about.html">About</a>
</nav>
</header>

<section class="courses-section">

    <h1>My Courses</h1>

    <p class="intro">
        Organize your university subjects in one place.
    </p>

    <div class="course-form">

        <h2>Add a New Course</h2>

        <input type="text" id="courseName"
        placeholder="Course Name">

        <input type="text" id="instructor"
        placeholder="Instructor Name">

        <textarea id="description"
        placeholder="Course Description"></textarea>

        <button onclick="addCourse()">
            Add Course
        </button>

    </div>

    <h2 class="my-title">My Subjects</h2>

    <div id="courseList" class="course-list">
        <p id="emptyMessage">
            No courses added yet.
        </p>
    </div>

</section>

<script>

let courses = JSON.parse(localStorage.getItem("myCourses")) || [];
    function displayCourses() {

    let courseList = document.getElementById("courseList");

    courseList.innerHTML = "";

    if (courses.length === 0) {

        let message = document.createElement("p");
        message.textContent = "No courses added yet.";
        message.id = "emptyMessage";

        courseList.appendChild(message);

        return;
    }

    courses.forEach(function(item, index) {

        let course = document.createElement("div");
        course.className = "course-card";

        let title = document.createElement("h3");
        title.textContent = item.name;

        let teacher = document.createElement("p");
        teacher.textContent = "Instructor: " + item.instructor;

        let details = document.createElement("p");
        details.textContent = item.description;

        let deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete Course";
        deleteButton.onclick = function() {
            deleteCourse(index);
        };

        course.appendChild(title);
        course.appendChild(teacher);
        course.appendChild(details);
        course.appendChild(deleteButton);

        courseList.appendChild(course);

    });

}

function addCourse() {

    let name = document.getElementById("courseName").value;
    let instructor = document.getElementById("instructor").value;
    let description = document.getElementById("description").value;

    if (name.trim() === "") {
        alert("Please enter the course name!");
        return;
    }

    let newCourse = {
        name: name,
        instructor: instructor,
        description: description
    };

    courses.push(newCourse);

    localStorage.setItem("myCourses", JSON.stringify(courses));

    displayCourses();

    document.getElementById("courseName").value = "";
    document.getElementById("instructor").value = "";
    document.getElementById("description").value = "";

}

displayCourses();
function deleteCourse(index) {

    if (confirm("Are you sure you want to delete this course?")) {

        courses.splice(index, 1);

        localStorage.setItem("myCourses", JSON.stringify(courses));

        displayCourses();

    }

}
</script>
 
</body>
</html>
